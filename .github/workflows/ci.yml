name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Prisma validate
        run: pnpm db:validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-secret-value-with-at-least-32-chars!!

      - name: Dependency audit (high+)
        run: pnpm audit --audit-level high
        continue-on-error: true # advisory until triage process exists (security.md)

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to clean database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # Guard: `prisma migrate deploy` silently succeeds with zero migrations.
      # Assert the expected tables actually exist before seeding.
      - name: Assert migrations created schema
        run: |
          cat > /tmp/schema-guard.sql <<'SQL'
          DO $$ BEGIN
            IF to_regclass('public.tenants') IS NULL
               OR to_regclass('public.organizations') IS NULL
               OR to_regclass('public.users') IS NULL
               OR to_regclass('public.sessions') IS NULL
               OR to_regclass('public.user_access_scopes') IS NULL
               OR to_regclass('public.audit_events') IS NULL
               OR to_regclass('public.auth_events') IS NULL THEN
              RAISE EXCEPTION 'migrations did not create expected tables';
            END IF;
          END $$;
          SQL
          pnpm exec prisma db execute --file /tmp/schema-guard.sql --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Verify seed runs
        run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          CI: "true" # suppress credential output in logs (see prisma/seed.ts)
